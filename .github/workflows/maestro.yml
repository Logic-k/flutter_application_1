name: Maestro UI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:          # 수동 실행 버튼 활성화

jobs:
  maestro:
    name: Maestro E2E (Android Emulator)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # APK 빌드 (에뮬레이터용 x86_64, IS_EMULATOR=true)
      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=IS_EMULATOR=true \
            --target-platform android-x64

      # KVM 활성화 (에뮬레이터 가속)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Maestro CLI 설치
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # 에뮬레이터 실행 + APK 설치 + Maestro 게이팅
      # 목록 정본은 maestro/gating_flows.txt(로컬 run_maestro_tests.ps1과 같은 목록).
      # android-emulator-runner는 script를 줄마다 따로 실행하므로 반복문은 스크립트 파일에 둔다.
      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install build/app/outputs/flutter-apk/app-debug.apk

            bash scripts/maestro_gating.sh

      # 스크린샷 투어 실행 (결과와 무관하게 항상)
      - name: Capture screenshots
        if: always()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk || true
            maestro test maestro/screenshot_tour_flow.yaml || true

      # 스크린샷 아티팩트 업로드
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: ~/.maestro/tests/
          retention-days: 30

      # 실패 시 디버그 아티팩트 업로드
      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-${{ github.run_number }}
          path: ~/.maestro/tests/
          retention-days: 7
