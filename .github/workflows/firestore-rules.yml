name: Firestore rules

# 보안 규칙의 허용·거부 테스트. 에뮬레이터(demo- 프로젝트)만 쓰고 운영 Firebase에는 접속하지 않는다.
on:
  push:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'firebase-tests/**'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'firebase-tests/**'
      - '.github/workflows/firestore-rules.yml'

jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json
      - run: npm ci
      - run: npx --yes firebase-tools@15.19.0 emulators:exec --config ../firebase.json --project demo-memorylink --only firestore "npm test"
