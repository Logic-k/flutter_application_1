appId: com.teammemorylink.memorylink
---
# 콜드 스타트 오프닝 "기억 속으로"(lib/features/opening/memory_opening.dart, DESIGN.md §4.1 네 번째 예외).
#
# 확인하는 것
#   1. 오프닝이 가리는 동안 아래 화면의 입력 칸이 접근성 트리에 없다 — 그래서 "사용자 아이디"를
#      기다리는 다른 flow 들이 오프닝을 눌러 버리지 않고 끝날 때까지 기다린다.
#   2. 오프닝이 끝나면 걷혀서 로그인·홈이 그대로 조작된다.
#   3. 누르면 건너뛴다.
#   4. 자동 로그인(DB 열기)이 걸리는 동안에는 정지 화면에서 기다렸다가 홈을 연다.
# 오프닝 층은 Semantics(identifier: 'memory_opening') → Android resource-id 로 잡는다.

# 1. 신규 상태 콜드 스타트. 세션이 없으면 로그인 확인이 바로 끝나 오프닝은 2.4초뿐이라,
#    Maestro 가 화면을 읽기 전에 끝날 수 있다. 그래서 여기서는 존재 확인을 선택 사항으로 둔다.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "memory_opening"
    timeout: 60000
    optional: true

# 2. 오프닝이 걷히면 로그인 화면이 나온다. 가려진 동안에는 이 문구가 보이지 않는다.
- extendedWaitUntil:
    visible: "사용자 아이디"
    timeout: 90000
- assertNotVisible:
    id: "memory_opening"

# 3. 로그인해서 세션을 만든다(다음 콜드 스타트가 자동 로그인이 되도록).
- tapOn: "사용자 아이디"
- inputText: "kim_minjun"
- hideKeyboard
- tapOn: "비밀번호"
- inputText: "demo1234"
- hideKeyboard
- tapOn: "로그인"
- extendedWaitUntil:
    visible: "오늘 걸음"
    timeout: 60000

# 4. 자동 로그인 콜드 스타트. DB 를 여는 동안 오프닝이 정지 화면에서 기다리므로 반드시 보인다.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "memory_opening"
    timeout: 60000
- takeScreenshot: opening_hold
- assertNotVisible: "오늘 걸음"
- extendedWaitUntil:
    visible: "오늘 걸음"
    timeout: 60000
- assertNotVisible:
    id: "memory_opening"

# 5. 건너뛰기. 오프닝을 누르면 준비된 즉시 가운데가 열린다(열림 0.6초).
#    오프닝은 계속 움직이므로 화면 안정화를 오래 기다리지 않는다.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "memory_opening"
    timeout: 60000
- tapOn:
    id: "memory_opening"
    waitToSettleTimeoutMs: 300
    optional: true # 누르기 전에 이미 끝났으면 건너뛸 것이 없다
- extendedWaitUntil:
    visible: "오늘 걸음"
    timeout: 60000
- assertNotVisible:
    id: "memory_opening"
