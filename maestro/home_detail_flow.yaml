appId: com.teammemorylink.memorylink
---
- runFlow: helpers/login_helper.yaml

# 홈 상단 고정 카드 (GestureDetector → merged semantics)
- assertVisible: "AI 도우미\nAI와 대화로 인지 건강을 확인해보세요"
- assertVisible: "오늘의 일기\n오늘 하루를 기록해보세요"

# 스크롤 후 걷기 미니 카드.
# 걸음 수는 데모 시드(`minjunSteps`)의 마지막 원소가 오늘에 매핑되어 변한다.
# 숫자를 단언하면 시드가 바뀔 때마다 깨지므로 라벨과 목표치만 지킨다.
- scrollUntilVisible:
    element:
      text: ".*오늘의 걸음.*"
    direction: DOWN
    visibilityPercentage: 50
- assertVisible: ".*오늘의 걸음.*"
- assertVisible: ".*/ 10,000 걸음.*"

# 스크롤 후 두뇌 건강 분석 카드 (MLSectionTitle → standalone text)
- scrollUntilVisible:
    element:
      text: "두뇌 건강 분석"
    direction: DOWN
- assertVisible: "두뇌 건강 분석"
