appId: com.teammemorylink.memorylink
---
# 리포트 화면 테스트
- runFlow: helpers/login_helper.yaml

# 리포트 탭
- tapOn: "리포트"
- extendedWaitUntil:
    visible: "주간 분석 리포트"
    timeout: 8000

# 리포트 화면 콘텐츠 확인 (body async 로딩 대기)
- assertVisible: "주간 분석 리포트"
- extendedWaitUntil:
    visible: "나의 인지 건강 일기"
    timeout: 10000
- assertVisible: "나의 인지 건강 일기"

# 활동 기록 리포트 버튼 확인
- scrollUntilVisible:
    element:
      text: "활동 기록 리포트 생성하기"
    direction: DOWN
- assertVisible: "활동 기록 리포트 생성하기"

# 홈 탭으로 복귀
- tapOn: "홈"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "MemoryLink"
    timeout: 5000
- assertVisible: "MemoryLink"
