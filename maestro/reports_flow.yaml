appId: com.example.flutter_application_1
---
# 리포트 화면 테스트
- runFlow: helpers/login_helper.yaml

# 리포트 탭 (70%, 93%)
- tapOn:
    point: "70%,93%"
- extendedWaitUntil:
    visible: "주간 분석 리포트"
    timeout: 8000

# 리포트 화면 콘텐츠 확인
- assertVisible: "주간 분석 리포트"
- assertVisible: "나의 인지 건강 일기"

# 임상 리포트 버튼 확인 (FilledButton - Semantics에 노출됨)
- scrollUntilVisible:
    element:
      text: "임상 리포트 생성하기"
    direction: DOWN
- assertVisible: "임상 리포트 생성하기"

# 홈 탭으로 복귀 (10%, 93%)
- tapOn:
    point: "10%,93%"
- extendedWaitUntil:
    visible: "오늘 걸음"
    timeout: 5000
- assertVisible: "오늘 걸음"
