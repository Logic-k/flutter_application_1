appId: com.teammemorylink.memorylink
---
# 리포트 화면 테스트
- runFlow: helpers/login_helper.yaml

# 리포트 탭 (64%, 93%)
- tapOn:
    point: "64%,93%"
- extendedWaitUntil:
    visible: "주간 분석 리포트"
    timeout: 8000

# 리포트 화면 콘텐츠 확인 (body async 로딩 대기)
- assertVisible: "주간 분석 리포트"
- extendedWaitUntil:
    visible: "나의 인지 건강 일기"
    timeout: 10000
- assertVisible: "나의 인지 건강 일기"

# 임상 리포트 버튼 확인
- scrollUntilVisible:
    element:
      text: "임상 리포트 생성하기"
    direction: DOWN
- assertVisible: "임상 리포트 생성하기"

# 홈 탭으로 복귀 (다른 탭 활성화 시 홈 탭 위치가 23-24%로 이동)
- tapOn:
    point: "24%,93%"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "MemoryLink"
    timeout: 5000
- assertVisible: "MemoryLink"
