appId: com.teammemorylink.memorylink
---
- runFlow: training_game_flow.yaml
- assertVisible: ".*레벨 1.*"
- assertVisible: ".*오늘 목표 1/3.*"
- swipe:
    start: "50%,80%"
    end: "50%,45%"
    duration: 500
- tapOn: ".*구구단 맞추기.*"
- extendedWaitUntil:
    visible: "가운데 수식의 정답을 아래에서 선택하세요."
    timeout: 10000
- back
- assertVisible: "두뇌 트레이닝 센터"
