appId: com.teammemorylink.memorylink
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "사용자 아이디"
    timeout: 90000
- tapOn: "사용자 아이디"
# 설치 직후 첫 입력은 첫 글자가 두 번 들어갈 때가 있다("kkim_minjun", 2026-10-05 로컬·CI 6차).
# 한 글자를 넣었다 지워 입력 연결을 먼저 세운 뒤 진짜 값을 넣는다.
- inputText: "x"
- eraseText
- inputText: "kim_minjun"
- tapOn: "비밀번호"
- inputText: "demo1234"
- hideKeyboard
- tapOn: "로그인"
- extendedWaitUntil:
    visible: "오늘 걸음"
    timeout: 20000
