appId: com.example.flutter_application_1
---
- runFlow: helpers/login_helper.yaml

# 생활습관 탭
- tapOn:
    point: "53%,93%"
- extendedWaitUntil:
    visible: "생활습관"
    timeout: 8000

# 원형 게이지 중앙 텍스트 (MLRing Stack 내 Text → accessible)
- extendedWaitUntil:
    visible: "/ 10,000 보"
    timeout: 10000
- assertVisible: "/ 10,000 보"

# 보행 정밀 분석 CTA 카드 (GestureDetector → merged: title\n설명)
- assertVisible: "보행 정밀 분석\n3분간의 걸음으로 당신의 뇌 건강 패턴을 분석합니다."
