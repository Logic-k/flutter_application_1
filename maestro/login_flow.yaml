appId: com.teammemorylink.memorylink
---
# 1. 앱 실행 (상태 초기화)
- launchApp:
    clearState: true

# 2. 앱 초기화 대기 (로그인 화면 TextField 등장까지)
# clearState 직후 첫 실행은 DB 생성 + v9 마이그레이션 + 30일치 데모 시드가 모두 돌아
# 콜드 스타트가 40초를 넘는다. helpers/login_helper.yaml과 같은 90초를 쓴다.
- extendedWaitUntil:
    visible: "사용자 아이디"
    timeout: 90000

# 3. 로그인 화면 요소 확인
- assertVisible: "사용자 아이디"
- assertVisible: "비밀번호"
- assertVisible: "로그인"

# 3. 아이디 입력
- tapOn: "사용자 아이디"
- inputText: "kim_minjun"

# 4. 비밀번호 입력
- hideKeyboard
- tapOn: "비밀번호"
- inputText: "demo1234"

# 5. 로그인 버튼 탭
- hideKeyboard
- tapOn: "로그인"

# 6. 로그인 성공 확인 (홈 화면 진입 대기 후 확인)
- extendedWaitUntil:
    visible: "오늘 걸음"
    timeout: 10000
- assertVisible: "오늘 걸음"
