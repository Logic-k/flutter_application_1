appId: com.teammemorylink.memorylink
---
# 내정보 화면 테스트
- runFlow: helpers/login_helper.yaml

# 내정보 탭 (90%, 93%)
- tapOn:
    point: "74%,93%"
- extendedWaitUntil:
    visible: "내 정보"
    timeout: 5000

# 내정보 화면 섹션 확인
- assertVisible: "내 정보"
- assertVisible: "건강 정보"
- assertVisible: "가족 및 연결"

# 고객센터 카드까지 스크롤 (merged text 직접 타깃)
# centerElement: 마지막 카드는 플로팅 네비 알약에 가려진 채로도 계층상 '보임'이라
# 기본 scrollUntilVisible이 거기서 멈춘다. 그러면 탭이 카드가 아니라 네비 바에
# 떨어져 화면 전환이 일어나지 않는다. 중앙으로 올려놓고 탭한다.
- scrollUntilVisible:
    element:
      text: "고객센터\n공지사항, FAQ, 1:1 문의"
    direction: DOWN
    centerElement: true
- tapOn: "고객센터\n공지사항, FAQ, 1:1 문의"
- extendedWaitUntil:
    visible: "공지사항\n서비스 업데이트 및 안내"
    timeout: 5000
- assertVisible: "공지사항\n서비스 업데이트 및 안내"
- assertVisible: "자주 묻는 질문\n이용 중 궁금한 점 확인"
- assertVisible: "1:1 문의하기\n직접 문의 접수"
- assertVisible: "내 문의 내역\n접수한 문의 및 답변 확인"

# 뒤로가기 → 내정보 복귀
- back
- extendedWaitUntil:
    visible: "내 정보"
    timeout: 5000
- assertVisible: "내 정보"
