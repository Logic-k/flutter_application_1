appId: com.teammemorylink.memorylink
---
# 보호자 안심 연결 카드 UI 테스트 (프로필 화면에서 시각적 확인)
- runFlow: helpers/login_helper.yaml

# 내정보 탭 진입
- tapOn:
    point: "74%,93%"
- extendedWaitUntil:
    visible: "내 정보"
    timeout: 5000

# 보호자 안심 연결 카드까지 스크롤 후 카드 UI 확인 (Flutter semantics merge로 title+subtitle이 하나의 노드로 병합됨)
- scrollUntilVisible:
    element:
      text: "가족 및 연결"
    direction: DOWN
- assertVisible: "보호자 안심 연결\n보호자가 활동 상태를 확인할 수 있습니다."
