appId: com.teammemorylink.memorylink
---
# 소셜 랭킹 (인구 통계학적 비교) 위젯 테스트
- runFlow: helpers/login_helper.yaml

# 리포트 탭 진입
- tapOn:
    point: "64%,93%"
- extendedWaitUntil:
    visible: "주간 분석 리포트"
    timeout: 8000
- assertVisible: "주간 분석 리포트"

# 소셜 랭킹 위젯까지 스크롤 후 전체 내용 확인
- scrollUntilVisible:
    element:
      text: "인구 통계학적 비교 (기억력)"
    direction: DOWN
    timeout: 60000
- assertVisible: "인구 통계학적 비교 (기억력)"
- assertVisible: "비슷한 연령대(60~70대) 사용자와 비교한 수치입니다."

# 점수 영역까지 추가 스크롤 (동년배 문구 확인)
- scrollUntilVisible:
    element:
      text: "동년배 중에서 평균보다 높은 수준의 인지 능력을 보여주고 계십니다. 훌륭합니다!"
    direction: DOWN
    timeout: 30000
- assertVisible: "동년배 중에서 평균보다 높은 수준의 인지 능력을 보여주고 계십니다. 훌륭합니다!"
