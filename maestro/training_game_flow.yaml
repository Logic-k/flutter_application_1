appId: com.teammemorylink.memorylink
---
- runFlow: helpers/login_helper.yaml
- tapOn: "인지훈련"
- extendedWaitUntil:
    visible: "두뇌 트레이닝 센터"
    timeout: 10000
- tapOn: ".*누가 큰가요.*"
- extendedWaitUntil:
    visible: "VS"
    timeout: 10000
# 07 계획 F-02: 답을 누르면 색 + 아이콘 + 문구 배지가 1.7초 동안 뜬다.
# 첫 문항만 배지를 확인하고(좌측 카드가 정답인지는 무작위라 둘 중 하나), 나머지는 기존대로 푼다.
# tapOn 은 기본적으로 화면이 멈출 때까지 기다려 그사이 배지가 사라지므로 대기를 줄인다.
- tapOn:
    point: "25%,55%"
    waitToSettleTimeoutMs: 300
- assertVisible: "(정답입니다|아쉬워요, 오답입니다)"
- waitForAnimationToEnd
- repeat:
    times: 9
    commands:
      - tapOn:
          point: "25%,55%"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "계속하기"
    timeout: 15000
- assertVisible: "(?s).*훈련 결과.*"
- assertVisible: "(?s).*XP.*"
- assertVisible: "(?s).*오늘 목표 1/3.*"
- assertVisible: "(?s).*새 활동 열림: 구구단 맞추기.*"
- extendedWaitUntil:
    visible: "계속하기"
    timeout: 15000
- tapOn: "계속하기"
- extendedWaitUntil:
    visible: "두뇌 트레이닝 센터"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: ".*누가 큰가요.*완료.*"
    direction: UP
    visibilityPercentage: 50
- assertVisible: ".*누가 큰가요.*완료.*"
- scrollUntilVisible:
    element:
      text: ".*구구단 맞추기.*"
    direction: DOWN
- assertVisible: ".*구구단 맞추기.*"
- assertVisible: ".*도전 가능.*"
