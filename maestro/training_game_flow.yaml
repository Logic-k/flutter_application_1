appId: com.teammemorylink.memorylink
---
- runFlow: helpers/login_helper.yaml
- tapOn: "인지훈련"
- extendedWaitUntil:
    visible: "두뇌 트레이닝 센터"
    timeout: 10000
- tapOn: ".*누가 큰가요.*"
- extendedWaitUntil:
    visible: "VS"
    timeout: 10000
- repeat:
    times: 10
    commands:
      - tapOn:
          point: "25%,55%"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "계속하기"
    timeout: 15000
- assertVisible: "(?s).*훈련 결과.*"
- assertVisible: "(?s).*XP.*"
- assertVisible: "(?s).*오늘 목표 1/3.*"
- assertVisible: "(?s).*새 활동 열림: 구구단 맞추기.*"
- extendedWaitUntil:
    visible: "계속하기"
    timeout: 15000
- tapOn: "계속하기"
- extendedWaitUntil:
    visible: "두뇌 트레이닝 센터"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: ".*누가 큰가요.*완료.*"
    direction: UP
    visibilityPercentage: 50
- assertVisible: ".*누가 큰가요.*완료.*"
- scrollUntilVisible:
    element:
      text: ".*구구단 맞추기.*"
    direction: DOWN
- assertVisible: ".*구구단 맞추기.*"
- assertVisible: ".*도전 가능.*"
