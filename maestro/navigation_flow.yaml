appId: com.example.flutter_application_1
---
# 하단 네비게이션 탭 전환 테스트
# 실제 좌표 (1080x2400): 홈=30%, 인지훈련=43%, 생활습관=53%, 리포트=64%, 내정보=74% / y=93%
- runFlow: helpers/login_helper.yaml

# 홈 탭 확인 (기본)
- assertVisible: "오늘 걸음"

# 인지훈련 탭
- tapOn:
    point: "43%,93%"
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: "두뇌 트레이닝 센터"
    timeout: 8000
- assertVisible: "두뇌 트레이닝 센터"

# 생활습관 탭
- tapOn:
    point: "53%,93%"
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: "생활습관"
    timeout: 8000
- assertVisible: "생활습관"

# 리포트 탭
- tapOn:
    point: "64%,93%"
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: "주간 분석 리포트"
    timeout: 8000
- assertVisible: "주간 분석 리포트"

# 내정보 탭
- tapOn:
    point: "74%,93%"
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: "내 정보"
    timeout: 8000
- assertVisible: "내 정보"

# 홈 탭으로 복귀 (다른 탭 활성화 시 홈 탭 위치가 23-24%로 이동)
- tapOn:
    point: "24%,93%"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "MemoryLink"
    timeout: 5000
- assertVisible: "MemoryLink"
