appId: com.teammemorylink.memorylink
---
# 하단 네비게이션 탭 전환 테스트
# 하단 탭은 이름(접근성 라벨: 홈·인지훈련·생활습관·리포트·내정보)으로 누른다. 화면 비율 좌표는
# 선택된 탭이 넓어지고 기기 크기가 달라지면 어긋났다(2026-10-05 라벨 탭으로 바꿈).
- runFlow: helpers/login_helper.yaml

# 홈 탭 확인 (기본)
- assertVisible: "오늘 걸음"

# 인지훈련 탭
- tapOn: "인지훈련"
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: "두뇌 트레이닝 센터"
    timeout: 8000
- assertVisible: "두뇌 트레이닝 센터"

# 생활습관 탭
- tapOn: "생활습관"
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: "생활습관"
    timeout: 8000
- assertVisible: "생활습관"

# 리포트 탭
- tapOn: "리포트"
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: "주간 분석 리포트"
    timeout: 8000
- assertVisible: "주간 분석 리포트"

# 내정보 탭
- tapOn: "내정보"
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: "내 정보"
    timeout: 8000
- assertVisible: "내 정보"

# 홈 탭으로 복귀
- tapOn: "홈"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "MemoryLink"
    timeout: 5000
- assertVisible: "MemoryLink"
