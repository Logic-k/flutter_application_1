appId: com.teammemorylink.memorylink
---
# 회원가입 플로우 테스트
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "사용자 아이디"
    timeout: 40000

# 회원가입 화면으로 이동
- tapOn: "처음이신가요? 회원가입"
- extendedWaitUntil:
    visible: "아이디.*"
    timeout: 5000

# 회원가입 화면 요소 확인
- assertVisible: "회원가입"
- assertVisible: "아이디.*"
- assertVisible: "비밀번호"
- assertVisible: "비밀번호 확인"

# 필수 정보 입력 (clearState로 DB 초기화되므로 testuser 재사용 가능)
- tapOn: "아이디.*"
# 설치 직후 첫 입력은 첫 글자가 두 번 들어갈 때가 있다("kkim_minjun", 2026-10-05 로컬·CI 6차).
# 한 글자를 넣었다 지워 입력 연결을 먼저 세운 뒤 진짜 값을 넣는다.
- inputText: "x"
- eraseText
- inputText: "testuser"
- tapOn: "이름.*"
- inputText: "tester"
- tapOn: "비밀번호"
- inputText: "test1234"
- tapOn: "비밀번호 확인"
- inputText: "test1234"

# 나이 / 체중 입력 (스크롤 필요)
- scrollUntilVisible:
    element:
      text: "나이 (세)"
    direction: DOWN
- tapOn: "나이 (세)"
- inputText: "65"
- tapOn: "체중 (kg)"
- inputText: "65"

# 가입 완료 버튼 탭
- scrollUntilVisible:
    element:
      text: "가입 완료"
    direction: DOWN
- tapOn: "가입 완료"

# 신규 가입자는 온보딩 게이트(동의 화면)로 리다이렉트된다
- extendedWaitUntil:
    visible: "개인정보 동의"
    timeout: 15000
- assertVisible: "개인정보 동의"
- assertVisible: "다음으로"
