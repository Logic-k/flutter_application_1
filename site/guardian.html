<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemoryLink 보호자 안심뷰</title>
  <style>
    :root {
      --bg: #0f1f24;
      --surface: #1a2f36;
      --surface2: #223840;
      --primary: #4caf9a;
      --primary-dim: #2e7a6a;
      --text: #e8f0ee;
      --text-muted: #8aacaa;
      --danger: #ef5350;
      --danger-bg: rgba(239,83,80,0.12);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Apple SD Gothic Neo', '맑은 고딕', sans-serif;
      min-height: 100vh;
      padding: 0 0 40px;
    }

    /* ── 헤더 ── */
    header {
      background: var(--surface);
      padding: 20px 24px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--surface2);
    }
    header .logo { font-size: 26px; }
    header h1 { font-size: 17px; font-weight: 700; }
    header p  { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    /* ── 공통 카드 ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      margin: 16px 16px 0;
    }
    .card-title {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── 이상 감지 배너 ── */
    .anomaly-card {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin: 16px 16px 0;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .anomaly-icon { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
    .anomaly-title { font-size: 15px; font-weight: 700; color: var(--danger); margin-bottom: 4px; }
    .anomaly-msg   { font-size: 13px; color: #ffbcbc; line-height: 1.55; }

    /* ── 걸음 수 카드 ── */
    .steps-big {
      font-size: 42px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -1px;
    }
    .steps-label { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
    .progress-wrap {
      margin-top: 14px;
      background: var(--surface2);
      border-radius: 8px;
      height: 10px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--primary-dim), var(--primary));
      transition: width 0.8s ease;
    }
    .progress-label {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: right;
    }

    /* ── 7일 차트 ── */
    .chart-wrap {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 90px;
      margin-top: 4px;
    }
    .chart-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 4px;
    }
    .chart-bar {
      width: 100%;
      border-radius: 4px 4px 0 0;
      background: var(--primary-dim);
      min-height: 3px;
      transition: height 0.6s ease;
    }
    .chart-bar.today { background: var(--primary); }
    .chart-date { font-size: 10px; color: var(--text-muted); }

    /* ── 훈련 점수 ── */
    .score-list { display: flex; flex-direction: column; gap: 12px; }
    .score-row  { display: flex; align-items: center; gap: 12px; }
  .score-cat  { font-size: 14px; flex: 0 1 72px; min-width: 0; overflow-wrap: anywhere; }
    .score-bar-wrap {
      flex: 1;
      height: 8px;
      background: var(--surface2);
      border-radius: 4px;
      overflow: hidden;
    }
    .score-bar {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--primary-dim), var(--primary));
    }
  .score-val { font-size: 14px; font-weight: 700; min-width: 62px; flex-shrink: 0; white-space: nowrap; text-align: right; }

    /* ── 메타 ── */
    .sync-info {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
      padding: 0 16px;
    }

    /* ── 소식 없음 (하트비트가 오래됨) ── */
    .stale-card {
      background: rgba(255, 193, 7, 0.10);
      border: 1px solid #ffc107;
      border-radius: var(--radius);
      padding: 16px 20px;
      margin: 16px 16px 0;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .stale-title { font-size: 15px; font-weight: 700; color: #ffd54f; margin-bottom: 4px; }
    .stale-msg   { font-size: 13px; color: #ffe8a3; line-height: 1.55; }

    /* ── 로딩 / 오류 ── */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
      color: var(--text-muted);
      font-size: 15px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--surface2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loading" class="center">
  <div class="spinner"></div>
  <span>데이터를 불러오는 중…</span>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="logo">🛡️</div>
    <div>
      <h1 id="headerName">보호자 안심뷰</h1>
      <p id="headerSub">MemoryLink</p>
    </div>
  </header>

  <!-- 소식 없음 (조건부): 휴대폰에서 6시간 넘게 갱신이 없을 때 -->
  <div id="staleCard" class="stale-card" style="display:none;">
    <div class="anomaly-icon">⏳</div>
    <div>
      <div class="stale-title">최근 소식이 없습니다</div>
      <div class="stale-msg" id="staleMsg"></div>
    </div>
  </div>

  <!-- 이상 감지 (조건부) -->
  <div id="anomalyCard" class="anomaly-card" style="display:none;">
    <div class="anomaly-icon">⚠️</div>
    <div>
      <div class="anomaly-title">활동량 이상 감지</div>
      <div class="anomaly-msg" id="anomalyMsg"></div>
    </div>
  </div>

  <!-- 걸음 수 -->
  <div class="card">
    <div class="card-title" id="stepsTitle">👣 오늘 걸음 수</div>
    <div class="steps-big" id="todaySteps">—</div>
    <div class="steps-label" id="stepsLabel">주간 평균 — 보</div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
    <div class="progress-label" id="progressLabel"></div>
  </div>

  <!-- 7일 그래프 -->
  <div class="card">
    <div class="card-title">📊 7일 활동 추이</div>
    <div class="chart-wrap" id="chartWrap"></div>
  </div>

  <!-- 인지 훈련 점수 -->
  <div class="card">
    <div class="card-title">🧠 인지 훈련 결과</div>
    <div class="score-list" id="scoreList">
      <span style="color:var(--text-muted);font-size:14px;">훈련 기록이 없습니다.</span>
    </div>
  </div>

  <div class="sync-info" id="syncInfo"></div>
</div>

<div id="errorView" class="center" style="display:none;">
  <div style="font-size:40px;">😕</div>
  <div id="errorMsg" style="text-align:center;line-height:1.6;"></div>
</div>

<script>
  const PROJECT_ID = 'memorylink-7af26';
  // API 키를 붙이지 않는다. 공개 사본은 규칙만으로 읽기를 허용하고, 앱용 키에는 안드로이드 앱 제한을 건다.

  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const TOKEN_PATTERN = /^[A-Za-z0-9_-]{16,64}$/;
  const STALE_HOURS = 6;

  // 로컬 확인 전용: 파일이나 localhost에서 열고 ?emulator=127.0.0.1:8180 을 주면
  // Firestore 에뮬레이터를 읽는다. 운영 주소(web.app)에서는 이 값을 무시한다.
  function documentsBase() {
    const local = location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname);
    const emulator = params.get('emulator');
    if (local && emulator && /^[A-Za-z0-9.-]+:\d{2,5}$/.test(emulator)) {
      return `http://${emulator}/v1/projects/${PROJECT_ID}/databases/(default)/documents`;
    }
    return `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;
  }

  function show(id)  { document.getElementById(id).style.display = ''; }
  function hide(id)  { document.getElementById(id).style.display = 'none'; }
  function setText(id, v) { document.getElementById(id).textContent = v; }

  // Firestore REST 응답에서 값 추출
  function fVal(field) {
    if (!field) return null;
    const key = Object.keys(field)[0];
    if (key === 'integerValue')  return parseInt(field[key]);
    if (key === 'doubleValue')   return parseFloat(field[key]);
    if (key === 'booleanValue')  return field[key];
    if (key === 'stringValue')   return field[key];
    if (key === 'timestampValue') return new Date(field[key]);
    if (key === 'arrayValue') {
      return (field[key].values || []).map(fVal);
    }
    if (key === 'mapValue') {
      const result = {};
      const fs = field[key].fields || {};
      for (const k in fs) result[k] = fVal(fs[k]);
      return result;
    }
    return null;
  }

  function fFields(fields) {
    const out = {};
    for (const k in fields) out[k] = fVal(fields[k]);
    return out;
  }

  function fmtNum(n) {
    return Number(n).toLocaleString('ko-KR');
  }

  function relativeTime(date) {
    if (!date) return '';
    const diff = Math.floor((Date.now() - date.getTime()) / 1000);
    if (diff < 60)  return '방금 전';
    if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
    if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
    return `${Math.floor(diff/86400)}일 전`;
  }

  function latest(a, b) {
    if (!(a instanceof Date)) return b instanceof Date ? b : null;
    if (!(b instanceof Date)) return a;
    return a > b ? a : b;
  }

  function sameLocalDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  function renderSteps(today, avg) {
    setText('todaySteps', fmtNum(today) + ' 보');
    setText('stepsLabel', `주간 평균 ${fmtNum(avg)} 보`);
    const pct = avg > 0 ? Math.min(Math.round(today / avg * 100), 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    setText('progressLabel', `목표 대비 ${pct}%`);
  }

  function renderChart(weeklyData, weeklyDates) {
    const wrap = document.getElementById('chartWrap');
    wrap.innerHTML = '';
    if (!weeklyData || weeklyData.length === 0) {
      wrap.innerHTML = '<span style="color:var(--text-muted);font-size:13px;">데이터 없음</span>';
      return;
    }
    const maxVal = Math.max(...weeklyData, 1);
    const today = new Date().toISOString().slice(0, 10);
    weeklyData.forEach((steps, i) => {
      const heightPct = Math.max((steps / maxVal) * 100, 3);
      const dateStr = weeklyDates && weeklyDates[i]
        ? weeklyDates[i].slice(5)   // MM-DD
        : '';
      const isToday = weeklyDates && weeklyDates[i] === today;

      const col = document.createElement('div');
      col.className = 'chart-col';

      const bar = document.createElement('div');
      bar.className = 'chart-bar' + (isToday ? ' today' : '');
      bar.style.height = heightPct + '%';
      bar.title = `${dateStr}: ${fmtNum(steps)}보`;

      const label = document.createElement('div');
      label.className = 'chart-date';
      label.textContent = dateStr;

      col.appendChild(bar);
      col.appendChild(label);
      wrap.appendChild(col);
    });
  }

  function renderScores(scores) {
    const list = document.getElementById('scoreList');
    if (!Array.isArray(scores) || scores.length === 0) return;
    list.innerHTML = '';
    scores.forEach(s => {
      const cat = typeof s?.category === 'string' ? s.category : '';
      const score = Number.isFinite(s?.score)
        ? Math.round(Math.min(100, Math.max(0, s.score))) : null;
      const row = document.createElement('div');
      row.className = 'score-row';
      const category = document.createElement('span');
      category.className = 'score-cat';
      category.textContent = cat;
      const wrap = document.createElement('div');
      wrap.className = 'score-bar-wrap';
      const bar = document.createElement('div');
      bar.className = 'score-bar';
      bar.style.width = `${score ?? 0}%`;
      wrap.appendChild(bar);
      const value = document.createElement('span');
      value.className = 'score-val';
      value.textContent = score === null ? '측정 불가' : `${score}점`;
      row.append(category, wrap, value);
      list.appendChild(row);
    });
  }

  async function loadData() {
    if (!token || !TOKEN_PATTERN.test(token)) {
      hide('loading');
      show('errorView');
      setText('errorMsg', '유효하지 않은 링크입니다.\n보호자 연결 QR을 다시 스캔해 주세요.');
      return;
    }

    const url = `${documentsBase()}/guardian_views/${encodeURIComponent(token)}`;

    try {
      const res = await fetch(url);
      // 만료·공유 중지·없는 링크는 규칙이 읽기를 거부한다(403). 예전 규칙에서는 404.
      if (res.status === 403 || res.status === 404) throw new Error('closed');
      if (!res.ok) throw new Error('fetch_error');
      const json = await res.json();
      const d = fFields(json.fields);
      const lastUpdate = latest(d.last_sync, d.last_heartbeat);
      const now = new Date();

      // 헤더 (공개 사본에는 로그인 아이디가 없다. 이름을 정하지 않았으면 '어르신')
      setText('headerName', (d.display_name || '어르신') + '님의 건강 현황');
      setText('headerSub', lastUpdate
        ? `MemoryLink 보호자 안심뷰 · 마지막 소식 ${relativeTime(lastUpdate)}`
        : 'MemoryLink 보호자 안심뷰');

      // 소식 없음: 마지막 갱신이 오래되면 숫자를 '지금 상태'처럼 보이지 않게 알린다
      if (!lastUpdate || (now - lastUpdate) > STALE_HOURS * 3600 * 1000) {
        show('staleCard');
        setText('staleMsg', lastUpdate
          ? `${relativeTime(lastUpdate)}부터 어르신 휴대폰에서 소식이 없습니다. 휴대폰이 꺼졌거나 걸음 측정이 꺼져 있을 수 있어요. 안부를 확인해 주세요.`
          : '아직 어르신 휴대폰에서 소식이 없습니다.');
      }
      if (lastUpdate && !sameLocalDay(lastUpdate, now)) {
        setText('stepsTitle', `👣 마지막 소식 날(${lastUpdate.getMonth() + 1}/${lastUpdate.getDate()})의 걸음 수`);
      }

      // 이상 감지
      if (d.is_anomaly) {
        document.getElementById('anomalyCard').style.display = 'flex';
        setText('anomalyMsg', d.anomaly_message || '활동량이 평소보다 낮습니다.');
      }

      // 걸음 수 (예전 문서 필드명도 읽는다: 규칙 배포 전후 전환용)
      renderSteps(d.today_steps || 0, d.weekly_avg ?? d.weekly_avg_steps ?? 0);

      // 7일 차트
      renderChart(d.weekly_steps || d.weekly_steps_data || [], d.weekly_dates || []);

      // 훈련 점수
      renderScores(d.scores || d.recent_scores || []);

      // 마지막 소식 시각과 링크 수명
      setText('syncInfo', (lastUpdate ? `마지막 소식: ${relativeTime(lastUpdate)} · ` : '')
        + '30일 동안 소식이 없으면 이 링크는 저절로 닫힙니다.');

      hide('loading');
      show('app');
    } catch (e) {
      hide('loading');
      show('errorView');
      const msg = e.message === 'closed'
        ? '이 링크는 만료되었거나 공유가 중지되었습니다.\n어르신 휴대폰의 MemoryLink에서 새 링크를 받아 주세요.'
        : '데이터 로드에 실패했습니다.\n잠시 후 다시 시도해 주세요.';
      setText('errorMsg', msg);
    }
  }

  loadData();
</script>
</body>
</html>
