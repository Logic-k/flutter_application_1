version: 2.1

# Draft: install only on the reviewed isolated trial branch. A push alone runs no job.
parameters:
  run_smoke:
    type: boolean
    default: false
  expected_source_sha:
    type: string
    default: ""

jobs:
  android_first_launch_smoke:
    machine:
      image: android:default
    resource_class: medium
    environment:
      EXPECTED_SOURCE_SHA: << pipeline.parameters.expected_source_sha >>
      EXPECTED_TRIAL_BRANCH: ci/memorylink-circleci-trial-20261002
    steps:
      - checkout
      - run:
          name: Build and verify the unauthenticated first-launch screen
          no_output_timeout: 15m
          command: timeout --signal=TERM --kill-after=60s 35m bash scripts/circleci_smoke.sh
      - store_test_results:
          path: build/ci-smoke/test-results
      - store_artifacts:
          path: build/ci-smoke
          destination: first-launch-smoke

workflows:
  explicit_trial_only:
    when: << pipeline.parameters.run_smoke >>
    jobs:
      - android_first_launch_smoke:
          filters:
            branches:
              only: ci/memorylink-circleci-trial-20261002
            tags:
              ignore: /.*/
