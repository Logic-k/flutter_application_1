<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 — MemoryLink</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F1F0FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131120" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 토큰은 index.html 과 같은 값. 404 만 색이 달라지면 사고처럼 보인다. */
:root{
  --primary:#6C5CE7; --primary-deep:#5847D6; --on-primary:#FFFFFF;
  --bg:#F1F0FB; --surface:#FFFFFF; --line:#E6E3F2;
  --text:#241F3D; --text-soft:#5E5978;
  --r-btn:14px; --r-card:26px;
  --shadow:0 1px 2px rgba(36,31,61,.05), 0 12px 32px rgba(36,31,61,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --primary:#A99BFF; --primary-deep:#C3B7FF; --on-primary:#17123A;
    --bg:#131120; --surface:#1D1A2C; --line:#332E49;
    --text:#F4F2FF; --text-soft:#C0BADD;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100dvh; display:grid; place-items:center; padding:24px;
  background:var(--bg); color:var(--text);
  font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','맑은 고딕',sans-serif;
  line-height:1.7; -webkit-font-smoothing:antialiased;
}
.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-card); box-shadow:var(--shadow);
  padding:44px 32px; max-width:520px; width:100%; text-align:center;
}
.code{font-size:13px; font-weight:700; letter-spacing:.12em; color:var(--primary)}
h1{font-size:24px; font-weight:700; margin:10px 0 12px; word-break:keep-all}
p{font-size:15px; color:var(--text-soft); word-break:keep-all}
.actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:28px}
a{
  display:inline-block; text-decoration:none; font-size:15px; font-weight:700;
  padding:13px 26px; border-radius:var(--r-btn); transition:background .15s, border-color .15s;
}
.primary{background:var(--primary); color:var(--on-primary)}
.primary:hover{background:var(--primary-deep)}
.ghost{border:1px solid var(--line); color:var(--text)}
.ghost:hover{border-color:var(--primary)}
a:focus-visible{outline:3px solid var(--primary); outline-offset:3px}
</style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 잘못 입력된 것 같습니다.<br>아래에서 이어서 둘러보실 수 있습니다.</p>
    <div class="actions">
      <a class="primary" href="/">소개 페이지로</a>
      <a class="ghost" href="/privacy">개인정보 처리방침</a>
    </div>
  </main>
</body>
</html>
